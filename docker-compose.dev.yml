# Local infrastructure only (Redis + ChromaDB). App services are added in milestone 1.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    command: ["redis-server", "--appendonly", "yes"]

  chroma:
    image: chromadb/chroma:1.5.9
    ports: ["8000:8000"]
    volumes: [chroma-data:/data]
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  redis-data:
  chroma-data:
