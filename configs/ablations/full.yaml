# Full cascade (pre-registered T1/T2, docs/PLAN.md section 9): Tier 0 -> Tier 1 -> Tier 2.
# Band generated by scripts/tune_band.py --rate 0.12 on the VALIDATION split only:
# [0.000, 0.270] around tau* = 0.200 holds 7/160 = 4.4% of val traffic.
# Isotonic p has few distinct levels, so this is the widest band whose val share is <= the
# target (the brief sets a ceiling); see the script docstring.
# Tier 2 is also hard-capped at gate.tier2_max_rate of all traffic and fails open to SHALLOW.
ablation:
  tiers: full
gate:
  band_low_offset: 0.2000
  band_high_offset: 0.0698
  tier2_max_rate: 0.12
  tier2_timeout_ms: 800
