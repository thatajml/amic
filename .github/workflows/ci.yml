name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:  # real Redis for tests/integration/test_redis_real.py (fakeredis elsewhere)
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AMIC_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch first, then project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[gate,eval,dev,llm-hosted]"   # llm-hosted: openai (judge/quota tests)
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Tests (fakes at the edges + a real Redis; no Ollama or model downloads)
        run: pytest -q
      - name: Gate-metric regression check (Tier 0 + Tier 1 on the committed edu fixture)
        run: python scripts/gate_regression.py
